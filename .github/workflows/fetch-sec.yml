name: Fetch SEC data

# Downloads official SEC EDGAR data into data/sec/TICKER.json
#  - Manually: Actions tab > "Fetch SEC data" > Run workflow > type tickers
#  - Automatically: every Monday for the tickers listed in data/watchlist.txt

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers, comma separated (leave blank to use data/watchlist.txt)"
        required: false
        default: ""
  schedule:
    - cron: "17 1 * * 1"   # Mondays 01:17 UTC

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download from SEC EDGAR
        env:
          TICKERS: ${{ github.event.inputs.tickers }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python scripts/fetch_sec.py
      - name: Save to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/sec
          git diff --cached --quiet || git commit -m "SEC data update $(date -u +%Y-%m-%d)"
          git push
